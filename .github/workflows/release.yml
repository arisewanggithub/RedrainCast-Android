name: Public Android release candidate
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact APK tag: v0.5.0 or v0.5.0-rc.1 (also alpha.N/beta.N)"
        required: true
        type: string
      source_validated:
        description: "I reviewed this exact source revision and authorize a signed release candidate"
        required: true
        type: boolean
        default: false
      reviewed_commit:
        description: "Full 40-character SHA of the reviewed current private main commit"
        required: true
        type: string
      publish:
        description: "Upload a public DRAFT; prerelease status follows the version suffix (requires scoped token)"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-android-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'arisewanggithub/RedrainCast-Android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_REPOSITORY: arisewanggithub/RedrainCast-Releases
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_VALIDATED: ${{ inputs.source_validated }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      PUBLISH: ${{ inputs.publish }}
      RELEASE_CERT_SHA256: 79f906220de117d61c2d15bdfcef179a4e3e48cfa0c76b637c7af986c037fad3
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check exact reviewed private main revision
        run: python3 -B tools/release-guard.py
      - name: Check required configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -B tools/release-guard.py --release-tag "$RELEASE_TAG"
          [[ "$SOURCE_VALIDATED" = true ]] || { echo "::error::Exact source revision must be reviewed before signing"; exit 1; }
          for name in KEYSTORE STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            [[ -n "${!name}" ]] || { echo "::error::Missing required release configuration: $name"; exit 1; }
          done
          if [[ "$PUBLISH" = true && -z "$PUBLISH_TOKEN" ]]; then
            echo "::error::Missing required release configuration: scoped RELEASE_PUBLISH_TOKEN"
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Validate and assemble optimized unsigned APK
        env:
          JAVA_TOOL_OPTIONS: -Djava.util.concurrent.ForkJoinPool.common.parallelism=3
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --console=plain
      - name: Test release tooling
        run: python3 -B tools/release-test.py
      - name: Sign, verify and prepare public assets
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 -B tools/release-guard.py
          umask 077
          key="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$key"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          version=$("$tools/aapt" dump badging "$unsigned" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          python3 -B tools/release-guard.py --release-tag "$RELEASE_TAG" --apk-version "$version"
          echo "Unsigned APK version verified: $version"
          mkdir -p "$RUNNER_TEMP/public-assets"
          apk="$RUNNER_TEMP/public-assets/RedrainCast-$version.apk"
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "$apk" "$RUNNER_TEMP/aligned.apk"
          if ! "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RUNNER_TEMP/public-assets/signing-certificate.txt"; then
            cat "$RUNNER_TEMP/public-assets/signing-certificate.txt"
            echo "::error::Signed APK signature verification failed"
            exit 1
          fi
          if grep -q 'CN=Android Debug' "$RUNNER_TEMP/public-assets/signing-certificate.txt"; then
            echo "::error::A development debug signing certificate cannot be published as a production release"
            exit 1
          fi
          python3 -B tools/release-guard.py \
            --certificate-report "$RUNNER_TEMP/public-assets/signing-certificate.txt"
          "$tools/zipalign" -c -P 16 4 "$apk"
          tar -czf "$RUNNER_TEMP/public-assets/licenses.tar.gz" -C app/src/main/assets NOTICE.txt OPUS-NOTICE.txt licenses
      - name: Build and smoke-test exact-build LGPL relink kit
        run: |
          set -euo pipefail
          python3 -B tools/release-kit.py \
            --ndk "$ANDROID_HOME/ndk/27.2.12479018" \
            --apk "$RUNNER_TEMP/public-assets/RedrainCast-${RELEASE_TAG#v}.apk" \
            --version "${RELEASE_TAG#v}" --cache "$RUNNER_TEMP/native-assets" \
            --output "$RUNNER_TEMP/public-assets/android-lgpl-relink.tar.gz"
          cd "$RUNNER_TEMP/public-assets"
          sha256sum ./*.apk ./*.tar.gz signing-certificate.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: signed-testing-candidate
          path: ${{ runner.temp }}/public-assets/
          retention-days: 3
          if-no-files-found: error
      - name: Upload public draft release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          python3 -B tools/release-guard.py
          kind="$(python3 -B tools/release-guard.py --release-tag "$RELEASE_TAG")"
          options=(--draft)
          if [[ "$kind" = prerelease ]]; then
            options+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/public-assets/"* \
            --repo "$RELEASE_REPOSITORY" "${options[@]}" \
            --title "RedrainCast $RELEASE_TAG (candidate)" \
            --notes "Draft release candidate; version suffix determines prerelease status. One universal APK supports arm64-v8a, armeabi-v7a and x86_64; Android 11/API 30 or newer. The intermittent first-rotation tiny-strip rendering bug remains unresolved; live Windows interoperability is not verified. A production-signed APK cannot update earlier debug-signed installations in place. Checksums, signing certificate, licenses and exact-build LGPL relink materials are attached. Application source remains private. Review all assets, runtime acceptance and stability before manually publishing this draft."
