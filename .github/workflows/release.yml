name: Public Android release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Exact APK tag, such as v0.5.1 or v0.5.1-rc.1"
        required: true
        type: string
      source_validated:
        description: "I reviewed this exact source revision and authorize its signed release build"
        required: true
        type: boolean
        default: false
      reviewed_commit:
        description: "Full 40-character SHA of the reviewed current main commit"
        required: true
        type: string
      publish:
        description: "Create a DRAFT in this repository; prerelease status follows the version suffix"
        required: true
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: public-android-release
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'arisewanggithub/RedrainCast-Android'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      SOURCE_VALIDATED: ${{ inputs.source_validated }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      RELEASE_CERT_SHA256: 79f906220de117d61c2d15bdfcef179a4e3e48cfa0c76b637c7af986c037fad3
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Check exact reviewed main revision
        run: python3 -B tools/release-guard.py
      - name: Check required configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 -B tools/release-guard.py --release-tag "$RELEASE_TAG"
          [[ "$SOURCE_VALIDATED" = true ]] || { echo "::error::Exact source revision must be reviewed before signing"; exit 1; }
          for name in KEYSTORE STORE_PASSWORD KEY_PASSWORD KEY_ALIAS; do
            [[ -n "${!name}" ]] || { echo "::error::Missing required release configuration: $name"; exit 1; }
          done
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install build tools
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Validate and assemble optimized unsigned APK
        env:
          JAVA_TOOL_OPTIONS: -Djava.util.concurrent.ForkJoinPool.common.parallelism=3
        run: bash ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease --console=plain
      - name: Test release tooling
        run: python3 -B tools/release-test.py
      - name: Create private per-attempt release directory
        run: |
          set -euo pipefail
          umask 077
          work="$RUNNER_TEMP/redraincast-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$work"
          echo "RELEASE_WORK=$work" >> "$GITHUB_ENV"
          mkdir "$work/public-assets" "$work/temp"
      - name: Sign, verify and prepare public assets
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 -B tools/release-guard.py
          umask 077
          key="$RELEASE_WORK/release.jks"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$key"
          tools="$ANDROID_HOME/build-tools/37.0.0"
          unsigned=app/build/outputs/apk/release/app-release-unsigned.apk
          version=$("$tools/aapt" dump badging "$unsigned" | sed -n "s/.*versionName='\([^']*\)'.*/\1/p" | head -n 1)
          python3 -B tools/release-guard.py --release-tag "$RELEASE_TAG" --apk-version "$version"
          echo "Unsigned APK version verified: $version"
          apk="$RELEASE_WORK/public-assets/RedrainCast-$version.apk"
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RELEASE_WORK/aligned.apk"
          "$tools/apksigner" sign --ks "$key" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false \
            --out "$apk" "$RELEASE_WORK/aligned.apk"
          if ! "$tools/apksigner" verify --verbose --print-certs "$apk" > "$RELEASE_WORK/public-assets/signing-certificate.txt"; then
            cat "$RELEASE_WORK/public-assets/signing-certificate.txt"
            echo "::error::Signed APK signature verification failed"
            exit 1
          fi
          if grep -q 'CN=Android Debug' "$RELEASE_WORK/public-assets/signing-certificate.txt"; then
            echo "::error::A development debug signing certificate cannot be published as a production release"
            exit 1
          fi
          python3 -B tools/release-guard.py \
            --certificate-report "$RELEASE_WORK/public-assets/signing-certificate.txt"
          "$tools/zipalign" -c -P 16 4 "$apk"
          tar -czf "$RELEASE_WORK/public-assets/licenses.tar.gz" -C app/src/main/assets NOTICE.txt OPUS-NOTICE.txt licenses
      - name: Build and smoke-test exact-build LGPL relink kit
        env:
          TMPDIR: ${{ env.RELEASE_WORK }}/temp
        run: |
          set -euo pipefail
          python3 -B tools/release-kit.py \
            --ndk "$ANDROID_HOME/ndk/27.2.12479018" \
            --apk "$RELEASE_WORK/public-assets/RedrainCast-${RELEASE_TAG#v}.apk" \
            --version "${RELEASE_TAG#v}" --cache "$RELEASE_WORK/native-assets" \
            --output "$RELEASE_WORK/public-assets/android-lgpl-relink.tar.gz"
          cd "$RELEASE_WORK/public-assets"
          sha256sum ./*.apk ./*.tar.gz signing-certificate.txt > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: signed-testing-candidate
          path: ${{ env.RELEASE_WORK }}/public-assets/
          retention-days: 3
          if-no-files-found: error
      - name: Remove this attempt's private release files
        if: always() && env.RELEASE_WORK != ''
        run: |
          set -euo pipefail
          expected="$RUNNER_TEMP/redraincast-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          [[ "$RELEASE_WORK" = "$expected" && -d "$RELEASE_WORK" && ! -L "$RELEASE_WORK" ]] || {
            echo "::error::Refusing cleanup outside this release attempt"
            exit 1
          }
          rm -rf -- "$RELEASE_WORK"
  publish:
    if: inputs.publish
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      REVIEWED_COMMIT: ${{ inputs.reviewed_commit }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: signed-testing-candidate
          path: candidate
      - name: Upload same-repository draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B tools/release-guard.py
          cd candidate
          sha256sum --check SHA256SUMS
          cd ..
          notes="tools/release-notes-${RELEASE_TAG}.md"
          [[ -s "$notes" ]] || { echo "::error::Missing versioned release notes: $notes"; exit 1; }
          kind="$(python3 -B tools/release-guard.py --release-tag "$RELEASE_TAG")"
          options=(--draft)
          if [[ "$kind" = prerelease ]]; then
            options+=(--prerelease)
          fi
          python3 -B tools/release-guard.py --release-tag "$RELEASE_TAG" --create-tag
          gh release create "$RELEASE_TAG" \
            "candidate/RedrainCast-${RELEASE_TAG#v}.apk" \
            candidate/SHA256SUMS candidate/signing-certificate.txt \
            candidate/licenses.tar.gz candidate/android-lgpl-relink.tar.gz \
            --repo "$GITHUB_REPOSITORY" --verify-tag "${options[@]}" \
            --title "RedrainCast $RELEASE_TAG" --notes-file "$notes"
          python3 -B tools/release-guard.py --release-tag "$RELEASE_TAG" --verify-tag
